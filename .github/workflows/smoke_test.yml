name: Smoke Test

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up venv and run
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install matplotlib networkx numpy scipy
          python3 main.py
